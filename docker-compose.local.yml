# Local development only: requires the frontend/admin repositories as siblings.
# docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  frontend:
    logging: *bounded-logging
    build:
      context: ../grok-agent-frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
        NEXT_PUBLIC_DESKTOP_BASE_URL: ${NEXT_PUBLIC_DESKTOP_BASE_URL:-http://localhost}
    ports:
      - "3000:3000"
    depends_on:
      - backend

  admin:
    logging: *bounded-logging
    build:
      context: ../grok-agent-admin
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
    ports:
      - "3001:3000"
    depends_on:
      - backend

