version: "3.9"

services:
  # Pre-build & tag sandbox template image for Go container manager
  sandbox-template:
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    image: grok-agent-sandbox:latest
    entrypoint: ["echo", "Sandbox template built"]

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: grokagent
      POSTGRES_USER: grokagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grokagent"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # OmniRoute Unified Model Gateway (OpenRouter, Gemini, Codex, Antigravity, Anthropic)
  omniroute:
    image: python:3.11-slim
    command: >
      bash -c "pip install --no-cache-dir fastapi uvicorn requests httpx litellm &&
               uvicorn --host 0.0.0.0 --port 8000 --factory litellm.proxy.proxy_server:app"
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${LLM_API_KEY}

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://grokagent:${POSTGRES_PASSWORD:-secret}@postgres:5432/grokagent
      REDIS_URL: redis://redis:6379
      LLM_BASE_URL: ${LLM_BASE_URL:-http://omniroute:8000/v1}
      LLM_API_KEY: ${LLM_API_KEY:-omniroute}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o}
      EMBED_API_KEY: ${LLM_API_KEY}
      EMBED_BASE_URL: ${LLM_BASE_URL:-http://omniroute:8000/v1}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      SANDBOX_IMAGE: grok-agent-sandbox:latest
      WORKSPACE_PATH: /workspaces
      SEARXNG_URL: http://searxng:8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - workspaces:/workspaces
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      omniroute:
        condition: service_started
      sandbox-template:
        condition: service_completed_successfully

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    volumes:
      - ./searxng:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/

volumes:
  postgres_data:
  workspaces:
