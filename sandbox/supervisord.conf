[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=10MB
pidfile=/var/run/supervisord.pid

[program:xvfb]
command=Xvfb :1 -screen 0 1280x800x24 -ac
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/xvfb.log
stderr_logfile=/var/log/supervisor/xvfb.err

[program:desktop]
command=openbox
environment=DISPLAY=:1,HOME=/root
autostart=true
autorestart=true
priority=20
depends_on=xvfb
stdout_logfile=/var/log/supervisor/desktop.log
stderr_logfile=/var/log/supervisor/desktop.err

[program:x11vnc]
command=x11vnc -display :1 -nopw -listen 0.0.0.0 -xkb -forever -shared -quiet
autostart=true
autorestart=true
priority=30
depends_on=xvfb
stdout_logfile=/var/log/supervisor/x11vnc.log
stderr_logfile=/var/log/supervisor/x11vnc.err

[program:novnc]
command=websockify --web=/usr/share/novnc/ 6080 localhost:5900
autostart=true
autorestart=true
priority=40
depends_on=x11vnc
stdout_logfile=/var/log/supervisor/novnc.log
stderr_logfile=/var/log/supervisor/novnc.err

[program:chromium]
command=/usr/local/bin/agent-chromium --no-sandbox --disable-setuid-sandbox --remote-debugging-port=9222 --remote-debugging-address=0.0.0.0 --disable-gpu --disable-dev-shm-usage --no-first-run --user-data-dir=/workspace/.browser --start-maximized about:blank
environment=DISPLAY=:1,HOME=/root
autostart=true
autorestart=true
priority=50
depends_on=desktop
stdout_logfile=/var/log/supervisor/chromium.log
stderr_logfile=/var/log/supervisor/chromium.err
